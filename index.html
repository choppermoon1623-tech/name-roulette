<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101418">
<title>ランダム指名ルーレット｜孫の手</title>
<style>
  :root{
    --bg:#101418; --panel:#1a2129; --panel2:#202a35; --line:rgba(255,255,255,.08);
    --text:#e8eef2; --muted:#8fa3af; --accent:#c8a35a; --accent2:#7fc4a0;
    --danger:#e8674f;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--jp);background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}

  /* ===== ステージ ===== */
  .stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .glow{position:absolute;inset:-30%;pointer-events:none;opacity:0;transition:opacity .5s;
    background:radial-gradient(circle at 50% 52%, rgba(200,163,90,.30), transparent 55%)}
  body.spinning .glow{opacity:1;animation:hue 1.1s linear infinite}
  @keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}

  .drum{position:absolute;top:calc(8px + 2vh);left:0;right:0;text-align:center;
    font-size:clamp(15px,3vh,24px);font-weight:800;color:var(--muted);
    letter-spacing:.25em;pointer-events:none;z-index:2}

  #wheel{display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}

  /* 当選者の特大オーバーレイ */
  .name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;z-index:5;padding:0 3vw;
    font-weight:900;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
  .name[hidden]{display:none}
  .name .inner{font-size:min(15vw,22vh);color:var(--accent);
    text-shadow:0 0 18px rgba(200,163,90,.8),0 0 80px rgba(200,163,90,.5),0 4px 30px rgba(0,0,0,.9);
    animation:reveal .7s cubic-bezier(.18,1.6,.4,1) both, throb 1.6s ease-in-out .8s infinite}
  @keyframes reveal{0%{transform:scale(.25);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .namebg{position:absolute;inset:0;background:rgba(10,13,16,.42);z-index:4;pointer-events:none}
  .namebg[hidden]{display:none}

  .idlemsg{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.5vh;
    align-items:center;justify-content:center;pointer-events:none;z-index:2}
  .idlemsg[hidden]{display:none}
  .idlemsg .big{font-size:min(18vw,20vh)}
  .idlemsg .t{font-size:clamp(15px,2.8vh,24px);font-weight:800;color:var(--muted)}

  .sub{position:absolute;bottom:calc(10px + 5.2vh);left:0;right:0;text-align:center;
    font-size:clamp(14px,2.6vh,22px);font-weight:800;color:var(--muted);z-index:2;
    pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .sub b{color:var(--accent2)}

  .hist{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:center;padding:0 14px;max-height:4.6vh;overflow:hidden;z-index:2;
    align-content:flex-end;pointer-events:none}
  .hist span{background:rgba(26,33,41,.9);border:1px solid var(--line);border-radius:999px;
    padding:2px 12px;font-size:clamp(11px,1.9vh,15px);font-weight:800;color:var(--muted)}
  .hist span:last-child{border-color:var(--accent);color:var(--accent)}
  .hist span i{font-style:normal;opacity:.55;margin-right:5px;font-size:.85em}

  #confetti{position:absolute;inset:0;pointer-events:none;z-index:6}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
  .flash.on{animation:fl .5s ease-out}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}

  .toggle{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);
    border-color:transparent;padding:8px 12px;font-size:13px;opacity:.35;z-index:8}
  .toggle:hover{opacity:1}
  body.bare .panel{display:none}

  /* ===== 操作パネル ===== */
  button{font-family:var(--jp);font-weight:800;cursor:pointer;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    padding:10px 16px;font-size:14px;transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:var(--accent);color:#20180a;border-color:transparent;
    font-size:17px;padding:12px 34px}
  button.primary:hover{filter:brightness(1.08)}
  button.primary:disabled{opacity:.45;cursor:default;transform:none}
  button.ghost{background:transparent}
  button.on{background:var(--accent2);color:#0d201a;border-color:transparent}

  .panel{background:var(--panel);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;flex:none}
  .hint{color:var(--muted);font-size:11.5px}
  .hint b{color:var(--text);background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;font-size:11px}

  /* ===== 名簿モーダル ===== */
  .modal{position:fixed;inset:0;background:rgba(10,13,16,.85);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
  .mbox h2{font-size:16px;font-weight:900;margin-bottom:4px}
  .mbox .mhint{font-size:12px;color:var(--muted);margin-bottom:10px}
  textarea{width:100%;height:min(300px,38vh);font-family:var(--jp);font-size:14px;
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:11px;padding:11px;outline:none;resize:vertical;line-height:1.6}
  textarea:focus{border-color:var(--accent2)}
  .mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
  .mrow .grow{flex:1}
  .mcount{font-size:12.5px;color:var(--accent2);font-weight:800}
  select,input[type=text]{font-family:var(--jp);font-weight:700;font-size:14px;
    padding:9px 12px;border-radius:9px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);outline:none}
  select:focus,input:focus{border-color:var(--accent2)}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="glow"></div>
  <button class="toggle" id="btn-bare">⌃ パネル</button>
  <div class="drum" id="drum"></div>
  <canvas id="wheel"></canvas>
  <div class="idlemsg" id="idlemsg">
    <div class="big">🎯</div>
    <div class="t">「名簿」から名前を入れてスタート！</div>
  </div>
  <div class="namebg" id="namebg" hidden></div>
  <div class="name" id="bigname" hidden><span class="inner" id="bigname-inner"></span></div>
  <div class="sub" id="sub"></div>
  <div class="hist" id="hist"></div>
  <canvas id="confetti"></canvas>
  <div class="flash" id="flash"></div>
</div>

<div class="panel">
  <button class="primary" id="btn-start">🎯 スタート</button>
  <button id="btn-exclude" class="on" title="一度選ばれた人を候補から外す">✋ 選ばれた人は除外</button>
  <button id="btn-sound" class="on">🔊 音</button>
  <button id="btn-roster">👥 名簿</button>
  <button class="ghost" id="btn-reset">↺ リセット</button>
  <span class="hint"><b>Space</b> でもスタート／画面クリックでもOK</span>
</div>

<!-- ===== 名簿モーダル ===== -->
<div class="modal" id="modal" hidden>
  <div class="mbox">
    <h2>👥 名簿</h2>
    <div class="mhint">1行に1人ずつ貼り付け（Excelの列コピーそのままでOK）。行頭の出席番号「1.」「01 」などは自動で外します</div>
    <textarea id="roster-text" placeholder="佐藤 さくら&#10;鈴木 大和&#10;高橋 結衣&#10;…"></textarea>
    <div class="mrow">
      <span class="mcount" id="roster-count"></span>
      <div class="grow"></div>
      <select id="list-select"><option value="">📚 保存したクラス…</option></select>
      <input type="text" id="list-name" placeholder="クラス名（例：2年3組）" style="width:150px">
      <button id="btn-save-list">💾 保存</button>
      <button class="ghost" id="btn-del-list" title="選択中のクラスを削除">🗑</button>
    </div>
    <div class="mrow">
      <div class="grow"></div>
      <button class="ghost" id="btn-mcancel">閉じる</button>
      <button class="primary" id="btn-mok" style="font-size:14px;padding:10px 24px">✓ この名簿を使う</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================
   名簿の解析
   ===================================================== */
function parseRoster(text){
  return text.split(/[\n\r,\t，、]+/)
    .map(s=>s.trim().replace(/^\d{1,3}[.．)）:：\s]+/,'').trim())
    .filter(s=>s.length>0);
}

/* =====================================================
   状態と保存
   ===================================================== */
const $=(id)=>document.getElementById(id);
const KEY='magonote-name-roulette-v1';
let store={lists:{}, roster:[], exclude:true, sound:true, history:[]};
try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(s&&typeof s==='object') store=Object.assign(store,s);
}catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} }

let spinning=false;
let winnerIdx=-1;   // 直前の当選者（盤面ハイライト用・roster内index）

/* =====================================================
   効果音（WebAudio 自前生成）
   ===================================================== */
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tickSound(pitch){
  if(!store.sound) return;
  try{
    const a=audio(), o=a.createOscillator(), g=a.createGain();
    o.type='square'; o.frequency.value=pitch;
    g.gain.setValueAtTime(.06,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.06);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime+.07);
  }catch(e){}
}
function fanfare(){
  if(!store.sound) return;
  try{
    const a=audio(), t0=a.currentTime;
    const notes=[[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.28,.5]];
    notes.forEach(([f,dt,dur])=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.16,t0+dt);
      g.gain.exponentialRampToValueAtTime(.001,t0+dt+dur);
      o.connect(g).connect(a.destination);
      o.start(t0+dt); o.stop(t0+dt+dur+.02);
    });
    [659,784].forEach(f=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.09,t0+.28);
      g.gain.exponentialRampToValueAtTime(.001,t0+.78);
      o.connect(g).connect(a.destination);
      o.start(t0+.28); o.stop(t0+.82);
    });
    const len=a.sampleRate*.5, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const src=a.createBufferSource(), g2=a.createGain(), hp=a.createBiquadFilter();
    hp.type='highpass'; hp.frequency.value=4500;
    g2.gain.value=.28;
    src.buffer=buf; src.connect(hp).connect(g2).connect(a.destination);
    src.start(t0+.28);
  }catch(e){}
}

/* =====================================================
   紙吹雪
   ===================================================== */
const confetti=$('confetti');
let particles=[], confettiRunning=false;
function burstConfetti(){
  const r=confetti.parentElement.getBoundingClientRect();
  confetti.width=r.width; confetti.height=r.height;
  const colors=['#c8a35a','#7fc4a0','#e8674f','#e8c451','#8fb8e8','#e88fd2','#ffffff'];
  particles=[];
  for(let i=0;i<180;i++){
    const side=Math.random()<.5?0:1;
    particles.push({
      x:side?r.width*(0.75+Math.random()*.2):r.width*(0.05+Math.random()*.2),
      y:r.height+10,
      vx:(side?-1:1)*(1.5+Math.random()*4.5),
      vy:-(9+Math.random()*8),
      w:6+Math.random()*7, h:4+Math.random()*5,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.35,
      color:colors[i%colors.length], life:0,
    });
  }
  if(!confettiRunning){ confettiRunning=true; requestAnimationFrame(confettiFrame); }
}
function confettiFrame(){
  const ctx=confetti.getContext('2d');
  ctx.clearRect(0,0,confetti.width,confetti.height);
  let alive=0;
  particles.forEach(p=>{
    p.life++;
    p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    p.vx*=.992;
    if(p.y<confetti.height+30&&p.life<400){
      alive++;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-p.life/280);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,Math.abs(Math.sin(p.life*.09))*p.h+1);
      ctx.restore();
    }
  });
  if(alive>0) requestAnimationFrame(confettiFrame);
  else{ confettiRunning=false; ctx.clearRect(0,0,confetti.width,confetti.height); }
}

/* =====================================================
   ルーレット盤の描画
   ===================================================== */
const wheel=$('wheel'), stage=$('stage');
const SEG_COLORS=['#c8a35a','#7fc4a0','#8fb8e8','#e88fd2','#e8c451','#d98d76'];
let rot=0;                 // 現在の回転角（ラジアン・時計回り）
let anim=null;             // {t0,dur,rot0,rotT,winner,lastIdx}
const POINTER=-Math.PI/2;  // ポインターは真上

function segColor(i,n){
  // 先頭と末尾が同じ色にならないように末尾だけずらす
  if(i===n-1&&n>1&&i%SEG_COLORS.length===0) return SEG_COLORS[2];
  return SEG_COLORS[i%SEG_COLORS.length];
}

function drawWheel(){
  const r=stage.getBoundingClientRect();
  const size=Math.floor(Math.min(r.width*.88, r.height*.80));
  const dpr=window.devicePixelRatio||1;
  if(wheel.width!==size*dpr){ wheel.width=size*dpr; wheel.height=size*dpr; }
  wheel.style.width=size+'px'; wheel.style.height=size+'px';
  const ctx=wheel.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);

  const n=store.roster.length;
  if(n===0) return;
  const cx=size/2, cy=size/2, R=size/2-8;
  const seg=Math.PI*2/n;
  const used=new Set(store.exclude?store.history:[]);

  ctx.save();
  ctx.translate(cx,cy);

  for(let i=0;i<n;i++){
    const a0=rot+i*seg, a1=a0+seg;
    const name=store.roster[i];
    const isUsed=used.has(name);
    const isWin=(i===winnerIdx&&!spinning);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R,a0,a1);
    ctx.closePath();
    ctx.fillStyle=isUsed?'#242c35':segColor(i,n);
    if(isWin) ctx.fillStyle='#fff';
    ctx.fill();
    ctx.strokeStyle='rgba(16,20,24,.85)';
    ctx.lineWidth=Math.max(1,R*.006);
    ctx.stroke();

    // 名前（半径方向・外向き）
    const fs=Math.max(9,Math.min(26,seg*R*.42));
    ctx.save();
    ctx.rotate(a0+seg/2);
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.font=`800 ${fs}px "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif`;
    ctx.fillStyle=isUsed?'#57646f':(isWin?'#20180a':'rgba(22,18,8,.88)');
    ctx.fillText(name, R*.93, 0, R*.55);
    ctx.restore();
  }

  // 外周リング
  ctx.beginPath();
  ctx.arc(0,0,R,0,Math.PI*2);
  ctx.lineWidth=Math.max(3,R*.02);
  ctx.strokeStyle='#c8a35a';
  ctx.stroke();
  // 外周の飾り玉
  const dots=Math.min(24,Math.max(8,n));
  for(let i=0;i<dots;i++){
    const a=rot*0.5+i*Math.PI*2/dots;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*R, Math.sin(a)*R, Math.max(2.5,R*.012), 0, Math.PI*2);
    ctx.fillStyle=i%2?'#e8eef2':'#c8a35a';
    ctx.fill();
  }

  // 中央ハブ
  ctx.beginPath();
  ctx.arc(0,0,R*.2,0,Math.PI*2);
  ctx.fillStyle='#1a2129';
  ctx.fill();
  ctx.lineWidth=Math.max(2,R*.012);
  ctx.strokeStyle='#c8a35a';
  ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(spinning){
    ctx.font=`900 ${R*.16}px sans-serif`;
    ctx.fillStyle='#c8a35a';
    ctx.fillText('？',0,0);
  }else{
    const pool=poolNow();
    ctx.font=`900 ${R*.1}px "Zen Kaku Gothic New",sans-serif`;
    ctx.fillStyle='#e8eef2';
    ctx.fillText(store.exclude?`のこり`:'全員',0,-R*.045);
    ctx.font=`900 ${R*.11}px sans-serif`;
    ctx.fillStyle='#7fc4a0';
    ctx.fillText(`${store.exclude?pool.length:store.roster.length}人`,0,R*.062);
  }
  ctx.restore();

  // ポインター（上の▼）
  ctx.save();
  ctx.translate(cx,cy-R);
  const pw=Math.max(12,R*.09), ph=Math.max(16,R*.13);
  ctx.beginPath();
  ctx.moveTo(-pw,-ph*.45);
  ctx.lineTo(pw,-ph*.45);
  ctx.lineTo(0,ph*.55);
  ctx.closePath();
  ctx.fillStyle='#e8674f';
  ctx.fill();
  ctx.lineWidth=3;
  ctx.strokeStyle='#101418';
  ctx.stroke();
  ctx.restore();
}

// ポインター位置のセグメント番号
function idxAtPointer(){
  const n=store.roster.length;
  if(!n) return -1;
  const seg=Math.PI*2/n;
  let a=(POINTER-rot)%(Math.PI*2);
  if(a<0)a+=Math.PI*2;
  return Math.floor(a/seg)%n;
}

/* ---- メインループ ---- */
let lastT=0;
function loop(now){
  if(anim){
    const p=Math.min(1,(now-anim.t0)/anim.dur);
    const ease=1-Math.pow(1-p,4); // 勢いよく回って徐々に減速
    const before=idxAtPointer();
    rot=anim.rot0+(anim.rotT-anim.rot0)*ease;
    const after=idxAtPointer();
    if(before!==after) tickSound(560+p*760);
    if(p>=1){ const w=anim.winner; anim=null; revealWinner(w); }
  }else if(!spinning&&store.roster.length>0&&winnerIdx<0){
    rot+=(now-lastT)*0.00012; // 待機中はゆっくり回転（当選発表中は停止）
  }
  lastT=now;
  drawWheel();
  requestAnimationFrame(loop);
}

/* =====================================================
   表示更新
   ===================================================== */
const sub=$('sub'), drum=$('drum'), hist=$('hist');
const bigname=$('bigname'), bignameInner=$('bigname-inner'), namebg=$('namebg');
function poolNow(){
  if(!store.exclude) return store.roster.slice();
  const used=new Set(store.history);
  return store.roster.filter(n=>!used.has(n));
}
function hideWin(){
  bigname.hidden=true; namebg.hidden=true;
  winnerIdx=-1;
}
function refresh(){
  const pool=poolNow();
  $('idlemsg').hidden=store.roster.length>0;
  if(store.roster.length===0){
    sub.innerHTML='';
  }else if(store.exclude){
    sub.innerHTML=pool.length
      ?''
      :'🎉 全員選ばれました！「リセット」でもう一周';
  }else{
    sub.innerHTML='';
  }
  hist.innerHTML='';
  store.history.forEach((n,i)=>{
    const s=document.createElement('span');
    s.innerHTML=`<i>${i+1}</i>`;
    s.appendChild(document.createTextNode(n));
    hist.appendChild(s);
  });
  $('btn-exclude').classList.toggle('on',store.exclude);
  $('btn-sound').classList.toggle('on',store.sound);
  $('btn-sound').textContent=store.sound?'🔊 音':'🔇 音';
  $('btn-start').disabled=spinning||poolNow().length===0;
}

/* =====================================================
   抽選
   ===================================================== */
function spin(){
  if(spinning) return;
  const pool=poolNow();
  if(pool.length===0){ refresh(); return; }
  const winnerName=pool[Math.floor(Math.random()*pool.length)];
  const wi=store.roster.indexOf(winnerName);
  const n=store.roster.length, seg=Math.PI*2/n;

  spinning=true;
  hideWin();
  refresh();
  document.body.classList.add('spinning');
  drum.textContent='だ れ か な …！？';

  // 当選セグメントの中心がポインター位置に来る回転角（4〜6周まわす）
  const jitter=(Math.random()-.5)*seg*.6;
  let target=POINTER-(wi*seg+seg/2)-jitter;
  const turns=4+Math.random()*2;
  while(target<rot+Math.PI*2*turns) target+=Math.PI*2;
  anim={t0:performance.now(), dur:3200+Math.random()*400, rot0:rot, rotT:target, winner:wi};
}

function revealWinner(wi){
  document.body.classList.remove('spinning');
  drum.textContent='';
  winnerIdx=wi;
  const winner=store.roster[wi];
  bignameInner.textContent=winner;
  bigname.hidden=false; namebg.hidden=false;
  const flash=$('flash');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  burstConfetti();
  fanfare();
  store.history.push(winner);
  save();
  spinning=false;
  refresh();
}

/* =====================================================
   名簿モーダル
   ===================================================== */
const modal=$('modal'), rosterText=$('roster-text'), listSelect=$('list-select');
function refreshListSelect(){
  const cur=listSelect.value;
  listSelect.innerHTML='<option value="">📚 保存したクラス…</option>';
  Object.keys(store.lists).sort().forEach(k=>{
    const o=document.createElement('option');
    o.value=k; o.textContent=`${k}（${store.lists[k].length}人）`;
    listSelect.appendChild(o);
  });
  listSelect.value=cur&&store.lists[cur]!==undefined?cur:'';
}
function refreshCount(){
  const n=parseRoster(rosterText.value).length;
  $('roster-count').textContent=n?`✓ ${n} 人`:'';
}
rosterText.addEventListener('input',refreshCount);
listSelect.addEventListener('change',()=>{
  const k=listSelect.value;
  if(k&&store.lists[k]){
    rosterText.value=store.lists[k].join('\n');
    $('list-name').value=k;
    refreshCount();
  }
});
$('btn-save-list').addEventListener('click',()=>{
  const name=$('list-name').value.trim();
  const names=parseRoster(rosterText.value);
  if(!name){ alert('クラス名を入れてください'); return; }
  if(!names.length){ alert('名簿が空です'); return; }
  store.lists[name]=names; save();
  refreshListSelect(); listSelect.value=name;
  $('roster-count').textContent=`💾 「${name}」に ${names.length} 人保存しました`;
});
$('btn-del-list').addEventListener('click',()=>{
  const k=listSelect.value;
  if(!k) return;
  if(confirm(`「${k}」を削除しますか？`)){
    delete store.lists[k]; save(); refreshListSelect();
  }
});
$('btn-roster').addEventListener('click',()=>{
  rosterText.value=store.roster.join('\n');
  refreshCount(); refreshListSelect();
  modal.hidden=false;
  if(!store.roster.length) rosterText.focus();
});
$('btn-mcancel').addEventListener('click',()=>{ modal.hidden=true; });
$('btn-mok').addEventListener('click',()=>{
  const names=parseRoster(rosterText.value);
  if(!names.length){ alert('名前が1人も見つかりません'); return; }
  const changed=JSON.stringify(names)!==JSON.stringify(store.roster);
  store.roster=names;
  if(changed) store.history=[];
  save();
  modal.hidden=true;
  hideWin();
  refresh();
});

/* =====================================================
   操作
   ===================================================== */
$('btn-start').addEventListener('click',spin);
stage.addEventListener('click',(e)=>{
  if(e.target.closest('.toggle')) return;
  if(!modal.hidden) return;
  spin();
});
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'&&modal.hidden){ e.preventDefault(); spin(); }
  if(e.key==='Escape') modal.hidden=true;
});
$('btn-exclude').addEventListener('click',()=>{ store.exclude=!store.exclude; save(); refresh(); });
$('btn-sound').addEventListener('click',()=>{ store.sound=!store.sound; save(); refresh(); });
$('btn-reset').addEventListener('click',()=>{
  if(!store.history.length) return;
  if(confirm('抽選の履歴をリセットしますか？')){
    store.history=[]; save();
    hideWin();
    refresh();
  }
});
$('btn-bare').addEventListener('click',()=>document.body.classList.toggle('bare'));

refresh();
requestAnimationFrame((t)=>{ lastT=t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
